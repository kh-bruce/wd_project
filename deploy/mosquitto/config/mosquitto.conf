# Mosquitto config for the wd_project (water duck) MQTT broker.
# Plain MQTT on 1883 for the trusted LAN; auth required (no anonymous).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# --- Authentication ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Listeners ---
listener 1883
protocol mqtt

# Optional: MQTT over WebSockets (browser-based MQTT debug clients)
listener 9001
protocol websockets
